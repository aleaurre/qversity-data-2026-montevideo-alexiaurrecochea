# dbt profiles for Qversity — Databricks (dbt-databricks adapter).
#
# Reemplaza el profile postgres. Vive dentro del repo para que CI/revisores
# corran `dbt run --profiles-dir ./dbt` sin copiar nada.
#
# Free Edition: dbt se conecta a un SQL Warehouse serverless vía http_path.
# Todos los secretos salen de env vars; los defaults NO son secretos.
#
# Cómo obtener los valores (Free Edition):
#   host       -> URL del workspace, sin https:// (ej. dbc-xxxx.cloud.databricks.com)
#   http_path  -> SQL Warehouses -> tu warehouse -> Connection details -> HTTP Path
#                 (forma: /sql/1.0/warehouses/<warehouse_id>)
#   token      -> Settings -> Developer -> Access tokens -> Generate new token
#   catalog    -> qversity   (el catálogo de Unity Catalog que crea la ingesta)
#
# Nota sobre el namespace de 3 niveles de Unity Catalog:
#   En dbt-databricks `catalog` = el catálogo UC (lo que en Postgres era `dbname`).
#   `schema` sigue siendo el schema por defecto; el macro generate_schema_name
#   + el +schema de dbt_project.yml resuelven bronze/silver/gold igual que antes.

qversity:
  target: dev
  outputs:

    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"          # dbc-xxxx.cloud.databricks.com
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}" # /sql/1.0/warehouses/<id>
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'qversity') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'silver') }}"
      threads: 4
