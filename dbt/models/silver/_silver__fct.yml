version: 2

models:
  - name: fct_transactions
    description: |
      Fact table: one row per transaction.
      Promotion of stg_transactions with table materialization and tested FKs.
      Syntactic derivations: is_failed, day_of_week. Remaining business
      derivations (revenue, signed amounts) are computed in gold.
    columns:
      - name: transaction_id
        description: PK of the transaction.
        tests:
          - unique
          - not_null

      - name: customer_id
        description: FK to dim_customer. 0 orphans confirmed on day 7.
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id

      - name: account_id
        description: FK to dim_account. 0 orphans confirmed on day 7.
        tests:
          - not_null
          - relationships:
              to: ref('dim_account')
              field: account_id

      - name: transaction_date
        description: Transaction date, already parsed in stg_transactions.
        tests:
          - not_null

      - name: amount
        description: |
          Transaction amount. NOT normalized by currency (no FX conversion
          in silver — deferred to gold if ever needed).
        # No not_null test: the dataset has ~3% of amounts NULL (generator DQ,
        # documented in decisions.md day 6). If a severity=warn test were
        # desired, add it here; for now we leave it untested.

      - name: currency
        description: Transaction currency. ISO 4217.
        tests:
          - not_null

      - name: transaction_type
        description: Transaction type. Normalized in stg_transactions via macro.
        tests:
          - not_null
          - accepted_values:
              values: ['deposit', 'withdrawal', 'transfer', 'payment', 'refund', 'fee']

      - name: channel
        description: Channel through which the transaction was made.
        tests:
          - not_null
          - accepted_values:
              values: ['mobile', 'web', 'atm', 'branch', 'pos']

      - name: status
        description: Transaction status.
        tests:
          - not_null
          - accepted_values:
              values: ['completed', 'pending', 'failed', 'reversed']

      - name: is_failed
        description: |
          True iff status = 'failed' strictly. Excludes pending (incomplete)
          and reversed (completed-then-reversed). Built for BQ 18.
        tests:
          - not_null

      - name: day_of_week
        description: |
          Day of week extracted from transaction_date (Postgres DOW:
          Sunday=0, Saturday=6). Built for BQ 16.
        tests:
          - not_null

  - name: fct_loans
    description: |
      Fact table: one row per loan. Financial metrics (principal, outstanding,
      interest_rate) live here; descriptors like loan_type are replicated to
      enable direct aggregations over the fact without a mandatory join to
      dim_loan.
    columns:
      - name: outstanding_balance
        description: |
          Outstanding loan balance in source currency. Synthetic dataset
          contains extreme outliers (~452 loans with balance > $100M,
          including 1 loan at $1.84B in COP). These are absurd for the
          implied retail/SME segment but mathematically valid downstream:
          they propagate into monthly_interest_income via the standard
          formula (balance * rate / 12). Test set to `warn` severity to
          make the issue visible on every `dbt test` run without blocking
          the pipeline. See decisions.md Day 11.
        tests:
          - dbt_utils.expression_is_true:
              expression: "< 100000000 or outstanding_balance is null"
              config:
                severity: warn

      - name: loan_id
        description: PK of the loan.
        tests:
          - unique
          - not_null

      - name: customer_id
        description: FK to dim_customer. 0 orphans confirmed on day 7.
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id

      - name: loan_type
        description: Loan type. Normalized in stg_loans via macro.
        tests:
          - not_null
          - accepted_values:
              values: ['personal', 'mortgage', 'auto', 'education', 'business']

      - name: status
        description: |
          Loan status. Derived delinquency definitions (combining status
          with days_past_due) are computed in gold.
        tests:
          - not_null
          - accepted_values:
              values: ['current', 'delinquent', 'default', 'paid_off']

      - name: currency
        description: Loan currency. ISO 4217.
        tests:
          - not_null

      - name: principal
        description: |
          Original loan amount. ~2.8% of loans have NULL principal in bronze
          (generator DQ, same pattern as stg_accounts.balance and
          stg_transactions.amount documented in decisions.md day 6).
          Test severity=warn: visible but does not block the build.
        tests:
          - not_null:
              severity: warn

      - name: outstanding_balance
        description: |
          Outstanding loan balance. ~2.9% of loans have NULL outstanding_balance
          in bronze (generator DQ). Test severity=warn.
        tests:
          - not_null:
              severity: warn

      - name: interest_rate
        description: |
          Annual interest rate in percentage scale (e.g., 19.3 = 19.3%).
          Preserved in original scale for auditability. For downstream
          financial calculations, use interest_rate_decimal.
          May contain NULLs due to generator DQ. Test severity=warn.
        tests:
          - not_null:
              severity: warn

      - name: interest_rate_decimal
        description: |
          Annual interest rate in decimal scale (e.g., 0.193 = 19.3%).
          Derived as interest_rate / 100. Use this column in gold-layer
          calculations to avoid scale errors. Documented in decisions.md day 9.
        tests:
          - dbt_utils.expression_is_true:
              expression: "= interest_rate / 100.0"
              where: "interest_rate is not null"

      - name: days_past_due
        description: Days overdue on payment.
        tests:
          - not_null

      - name: start_date
        description: Loan start date.
        tests:
          - not_null

      - name: end_date
        description: Loan end date (projected based on term_months).
        tests:
          - not_null

          