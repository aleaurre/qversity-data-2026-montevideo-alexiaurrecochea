version: 2

# Sources for the silver layer on Databricks.
#
# Two sources, both inside the `qversity` Unity Catalog:
#   - silver_staging -> schema silver_raw : the tables the flatten notebooks
#     write (stg_accounts / stg_transactions / stg_loans).
#   - bronze         -> schema bronze     : raw_fintech_data, read by
#     dim_customer for the non-array objects (e.g. credit_info).
#
# CAMBIO vs Postgres: agregamos `database: qversity` (= catálogo UC). En la
# versión Postgres no existía porque era una sola base; acá el namespace es
# de 3 niveles y dbt necesita saber el catálogo del source.

sources:
  - name: silver_staging
    database: qversity        # Unity Catalog catalog
    schema: silver_raw        # written by the PySpark flatten notebooks
    tables:
      - name: stg_accounts
      - name: stg_transactions
      - name: stg_loans

  - name: bronze
    database: qversity
    schema: bronze
    tables:
      - name: raw_fintech_data
