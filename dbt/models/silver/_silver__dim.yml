version: 2

# Tests for silver models.
#
# Day 6 coverage for dim_customer:
#   - Identity: unique + not_null on PK.
#   - Categoricals: accepted_values on status, kyc_status, segment, country,
#     age_bucket, tenure_bucket — all reflecting observed canonical values.
#   - Geo: not_null on the flag; expression test that flag and lat/lon agree.
#   - nationality redundancy: expression test that nationality = country
#     (defensive; if it ever fails in a future run, that's a real signal).
#   - Age sanity: expression test that age is between 18 and 100 when not null.
#
# Tests for stg_*, dim_account, dim_loan, dim_geography, dim_date, and
# agg_customer_activity are added in the same yml as those models land.

models:

  - name: dim_customer
    description: >
      One row per customer. Flat customer attributes from bronze, deduplicated
      by customer_id (keeping the latest load_timestamp), with derived age,
      age_bucket, tenure_months, tenure_bucket, and validated coordinates.
    columns:

      - name: customer_id
        description: Business key from the source system. Format CUST-XXXXXXX.
        tests:
          - unique
          - not_null

      - name: email
        description: >
          Customer email address. Not enforced unique because the dataset may
          legitimately contain shared emails (joint accounts, family). We test
          for non-null only.
        tests:
          - not_null

      - name: country
        description: ISO country code, restricted to the seven LATAM markets.
        tests:
          - not_null
          - accepted_values:
              # Source: Qversity spec §3.2 — Colombia, Uruguay, Argentina,
              # Mexico, Chile, Peru, Brazil.
              values: ['CO', 'UY', 'AR', 'MX', 'CL', 'PE', 'BR']

      - name: nationality
        description: >
          ISO country code of nationality. In this dataset, nationality
          equals country in 100% of records (verified in EDA day 6).
          Kept for completeness; defensive test asserts the equality holds.
        tests:
          - not_null

      - name: kyc_status
        description: KYC verification state from the source system.
        tests:
          - not_null
          - accepted_values:
              # Source: Qversity spec §3.3 — verified / pending / expired / rejected.
              values: ['verified', 'pending', 'expired', 'rejected']

      - name: status
        description: >
          Customer relationship state. Normalized from 20 raw variants to
          4 canonical values via the normalize_customer_status macro.
        tests:
          - not_null
          - accepted_values:
              # Source: Qversity spec §3.3.
              values: ['active', 'inactive', 'suspended', 'closed']

      - name: customer_segment
        description: Business segmentation tier.
        tests:
          - not_null
          - accepted_values:
              # Source: Qversity spec §3.3.
              values: ['retail', 'premium', 'private_banking', 'sme']

      - name: age
        description: >
          Completed years from date_of_birth at run time. May be null when
          date_of_birth is missing or unparseable. When not null, must be
          between 18 (banks don't onboard minors) and 100 (sanity ceiling).

      - name: age_bucket
        description: >
          LATAM fintech age segmentation. See decisions.md for rationale.
        tests:
          - not_null
          - accepted_values:
              values: ['under_18', '18-25', '26-35', '36-50', '51-65', '65+', 'unknown']

      - name: tenure_months
        description: >
          Months since registration_date at run time. Null when
          registration_date is null or unparseable.

      - name: tenure_bucket
        description: Customer tenure segmentation. See decisions.md.
        tests:
          - not_null
          - accepted_values:
              values: ['new', 'established', 'loyal', 'unknown']

      - name: is_geo_valid
        description: >
          True when lat ∈ [-90, 90] and lon ∈ [-180, 180]. False when either
          is out of range or null. When false, lat and lon are also nulled out.
        tests:
          - not_null

    tests:
      # Defensive: nationality has been identical to country in 100% of records
      # in the current dataset. If this ever fails in a future run, it's a
      # signal that the data has changed (expats, dual citizenship, etc.) and
      # we should revisit assumptions in dim_customer and downstream marts.
      - dbt_utils.expression_is_true:
          expression: "nationality = country"
          config:
            severity: warn

      # When is_geo_valid is true, lat and lon must be populated; when false,
      # both must be null. This asserts the consistency we engineered in the
      # model's enriched CTE.
      - dbt_utils.expression_is_true:
          expression: >
            (is_geo_valid = true  and lat is not null and lon is not null)
            or
            (is_geo_valid = false and lat is null     and lon is null)

      # Sanity: when age is populated, it must be in [18, 100]. Banks
      # don't onboard minors, and 100+ years is most likely a generator bug.
      - dbt_utils.expression_is_true:
          expression: "age is null or (age between 18 and 100)"