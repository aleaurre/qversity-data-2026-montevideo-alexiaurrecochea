version: 2

models:
  - name: int_loan_portfolio_metrics
    description: |
      Loan-grain analytics base with delinquency flags, DPD bucket, and
      monthly accrued interest pre-computed. Consumed by mart_loan_dpd and
      mart_loan_composition. Materialized as view (small input, no caching benefit).
      Business logic centralization point for all loan portfolio gold marts.
      See decisions.md Day 9 §2, §3.
    columns:
      - name: loan_id
        description: "PK from fct_loans, preserved grain."
        tests:
          - unique
          - not_null
      
      - name: customer_id
        description: "FK to dim_customer."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      
      - name: loan_type
        description: "Loan type (personal, mortgage, auto, education, business)."
        tests:
          - not_null
          - accepted_values:
              values: ['personal', 'mortgage', 'auto', 'education', 'business']
      
      - name: status
        description: "Loan status (current, delinquent, default, paid_off)."
        tests:
          - not_null
          - accepted_values:
              values: ['current', 'delinquent', 'default', 'paid_off']
      
      - name: currency
        description: "ISO 4217 currency code."
        tests:
          - not_null
          - relationships:
              to: ref('fx_rates')
              field: currency
      
      - name: is_delinquent
        description: "DPD >= 30. Collections operational metric."
        tests:
          - not_null
      
      - name: is_default
        description: "DPD >= 90 OR status='default'. Basel/IFRS9 regulatory metric."
        tests:
          - not_null
      
      - name: dpd_bucket
        description: "6-bucket DPD aging (decisions.md Day 9 §3)."
        tests:
          - not_null
          - accepted_values:
              values:
                - '00 - Current'
                - '01 - Early (1-29)'
                - '02 - 30-59 DPD'
                - '03 - 60-89 DPD'
                - '04 - 90-179 DPD'
                - '05 - 180+ DPD'
      
      - name: monthly_interest_accrued
        description: |
          Monthly interest in native currency. 0 for inactive loans 
          (paid_off, default) and for loans with NULL balance or rate.
          Uses interest_rate_decimal (decisions.md Day 9 §1 fix).
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: int_customer_risk_profile
    description: |
      Customer-grain risk and credit profile base. Centralizes bucketing
      (risk, credit_score, utilization) and customer-level delinquency
      flags (any-rule rollup from int_loan_portfolio_metrics). Consumed by
      mart_delinquency_by_segment, mart_credit_score_by_country,
      mart_utilization_vs_delinquency, mart_risk_buckets.
    columns:
      - name: customer_id
        description: "PK from dim_customer."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      
      - name: country
        tests:
          - not_null
          - accepted_values:
              values: ['AR', 'BR', 'CL', 'CO', 'MX', 'PE', 'UY']
      
      - name: customer_segment
        tests:
          - not_null
          - accepted_values:
              values: ['retail', 'premium', 'private_banking', 'sme']
      
      - name: is_delinquent_customer
        description: "Any-rule: TRUE if customer has at least one delinquent loan."
        tests:
          - not_null
      
      - name: is_default_customer
        description: "Any-rule: TRUE if customer has at least one default loan."
        tests:
          - not_null
      
      - name: loans_count
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: int_customer_monthly_revenue
    description: |
      Customer-grain monthly revenue base. Centralizes the revenue definition
      (monthly fees + monthly interest accrued) so both mart_customer_360 and
      mart_revenue_by_segment_usd consume it instead of duplicating the SQL.
      Exposes both native-currency and USD versions of each component. See
      decisions.md §1 + Day 9 corrections (interest_rate scale, temporal
      consistency) and Day 10 refactor note.
    columns:
      - name: customer_id
        description: "PK from dim_customer."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id

      - name: total_fees_paid_lifetime_native
        description: |
          Lifetime cumulative completed fees in native currency. Kept for
          auditability and reconciliation with the source dataset; downstream
          analytics use the monthly column instead.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_fees_paid_lifetime_usd
        description: "Same as above, converted to USD via fx_rates."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: monthly_fee_revenue_native
        description: |
          Lifetime fees normalized to monthly via tenure_months. Zero-tenure
          customers (~0.9 %) get 0 via COALESCE. Native currency.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: monthly_fee_revenue_usd
        description: "Same as above, in USD."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: monthly_interest_revenue_native
        description: |
          Monthly accrued interest on active loans (status in current/
          delinquent). Default and paid_off loans accrue zero. Native currency.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: monthly_interest_revenue_usd
        description: "Same as above, in USD."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_monthly_revenue_native
        description: "monthly_fee_revenue_native + monthly_interest_revenue_native."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_monthly_revenue_usd
        description: "monthly_fee_revenue_usd + monthly_interest_revenue_usd."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"