version: 2

# Tests for gold models.
#
# Day 5 has a single gold model; tests here are minimal but real:
# the unique+not_null pair on customer_id is a load-bearing assertion
# because if a single customer appears twice in gold, every "by customer"
# metric in PowerBI is silently wrong.

models:

  - name: customer_summary
    description: One row per customer with demographics and product counts.
    columns:

      - name: customer_id
        description: PK. Must remain 1:1 with dim_customer.
        tests:
          - unique
          - not_null
          # Referential integrity: every gold customer must exist in silver.
          # If this ever fails, dim_customer probably broke its uniqueness.
          - relationships:
              to: ref('dim_customer')
              field: customer_id

      - name: country
        tests:
          - not_null

      - name: accounts_count
        description: COALESCE'd to zero, so never null.
        tests:
          - not_null

      - name: transactions_count
        tests:
          - not_null

      - name: loans_count
        tests:
          - not_null