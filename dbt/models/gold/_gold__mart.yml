version: 2

# ============================================================================
# Tests for Gold layer mart models.
#
# Convention: every mart has at minimum:
#   - PK uniqueness + not_null
#   - accepted_values on every normalized categorical (catches macro/source drift)
#   - relationships from customer-grain marts to silver.dim_customer
#   - expression_is_true on numeric metrics that must satisfy invariants
#     (e.g. non-negative, percentages in [0, 100])
#
# These tests are tight on purpose: a passing test suite is the contract
# between the Gold layer and PowerBI consumers downstream.
# ============================================================================

models:

  # --------------------------------------------------------------------------
  - name: mart_acquisition_trend
    description: >
      One row per calendar month. New customer acquisitions per month with
      cumulative total and MoM growth percentage. Source for Q12 (acquisition
      trend over time). Excludes customers with NULL registration_date.
    columns:

      - name: month
        description: First day of the month (date_trunc to month).
        tests:
          - unique
          - not_null

      - name: year
        tests:
          - not_null

      - name: month_number
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 1 and 12"

      - name: month_label
        description: "YYYY-MM string for chronological-lexicographic sort in BI."
        tests:
          - unique
          - not_null

      - name: new_customers
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: cumulative_customers
        description: Running total of new_customers, ascending by month.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: mom_growth_pct
        description: >
          Month-over-month % change in new_customers. NULL for first month
          (no prior reference) or when previous month had zero acquisitions.

  # --------------------------------------------------------------------------
  - name: mart_account_mix
    description: >
      One row per (country × account_type × currency). Account counts and
      balance metrics. Sources for Q22 (popular account types) and Q2
      (balances by country, in source currency). Only active accounts.
      Multi-currency: balances are NOT converted (no FX table); grain
      includes currency so sums never mix incompatible units.
    columns:

      - name: country
        tests:
          - not_null
          - accepted_values:
              values: ['AR', 'BR', 'CL', 'CO', 'MX', 'PE', 'UY']

      - name: account_type
        tests:
          - not_null
          - accepted_values:
              values: ['savings', 'checking', 'investment', 'credit_card']

      - name: currency
        tests:
          - not_null

      - name: accounts_count
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: accounts_with_balance
        description: >
          Subset of accounts_count that have a non-null balance. Exposes
          missing-data rate (~3.1% of active accounts have NULL balance,
          uniformly distributed across types/currencies — synthetic dataset
          noise per decisions.md Day 8).
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_balance
        description: "SUM of balance in source currency. NULL when no account had a balance."

      - name: pct_of_country_accounts
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 100"

      - name: pct_of_total_accounts
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 100"

    tests:
      # Each country's percentages should sum to 100 (within rounding tolerance).
      - dbt_utils.expression_is_true:
          expression: "pct_of_country_accounts >= 0 and pct_of_country_accounts <= 100"

  # --------------------------------------------------------------------------
  - name: mart_customer_360
    description: >
      One row per customer. Source of truth for Q1 (revenue by segment),
      Q9 (risk buckets), Q10 (count by country/city), Q11 (age by segment),
      Q13 (status breakdown), Q14 (KYC distribution), Q24 (products by segment).
      Combines demographics, relationship, risk, credit profile, digital
      engagement, product counts, and revenue metrics.
    columns:

      - name: customer_id
        description: Primary key. 1:1 with silver.dim_customer.
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id

      - name: country
        tests:
          - not_null
          - accepted_values:
              values: ['AR', 'BR', 'CL', 'CO', 'MX', 'PE', 'UY']

      - name: age
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 18 and 120"

      - name: age_bucket
        tests:
          - not_null
          - accepted_values:
              values: ['18-25', '26-35', '36-50', '51-65', '65+', 'under_18', 'unknown']

      - name: customer_segment
        tests:
          - not_null
          - accepted_values:
              values: ['retail', 'premium', 'private_banking', 'sme']

      - name: tenure_months
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: tenure_bucket
        tests:
          - not_null
          - accepted_values:
              values: ['new', 'established', 'loyal', 'unknown']

      - name: kyc_status
        tests:
          - not_null
          - accepted_values:
              values: ['verified', 'pending', 'expired', 'rejected']

      - name: status
        description: Customer-level status (distinct from account.status which also has 'frozen').
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'inactive', 'suspended', 'closed']

      - name: risk_score
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 0 and 100"

      - name: risk_bucket
        description: >
          Bucketed risk_score per Q9 literal: "low/medium/high/critical".
          'unknown' should NEVER appear with valid risk_score [0,100] — if it
          does, get_risk_bucket macro has a regression (see decisions.md Day 8).
        tests:
          - not_null
          - accepted_values:
              values: ['low', 'medium', 'high', 'critical']

      - name: credit_score
        description: Validated FICO score [300, 850]. NULL when source was corrupt (~10% per EDA).
        # Range check moved to model-level tests below (column-level expression_is_true
        # auto-prefixes column name, causing syntax error with "is null or" patterns).

      - name: credit_score_bucket
        tests:
          - accepted_values:
              values: ['poor', 'fair', 'good', 'very_good', 'exceptional', 'unknown']

      - name: utilization_pct
        # Range check moved to model-level tests below.

      - name: utilization_bucket
        tests:
          - accepted_values:
              values: ['healthy', 'moderate', 'high', 'maxed', 'over_limit', 'unknown']

      - name: bankruptcy_flag
        tests:
          - not_null

      - name: accounts_count
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: loans_count
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: transactions_count
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_products
        description: "Sum of accounts_count + loans_count (per silver.agg_customer_activity)."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_fees_paid_lifetime
        description: |
          Lifetime cumulative fees paid by the customer (completed fees only).
          Preserved for auditability. For monthly revenue calculations,
          use monthly_fee_revenue instead. See decisions.md Day 9.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: monthly_fee_revenue
        description: |
          Monthly fee revenue = total_fees_paid_lifetime / tenure_months.
          Customers with tenure_months=0 receive 0 via COALESCE.
          See decisions.md Day 9 on temporal consistency fix.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: monthly_interest_income
        description: "Accrued monthly interest on active loans (current + delinquent)."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_revenue_monthly
        description: "total_fees_paid + monthly_interest_income."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

    tests:
      - dbt_utils.expression_is_true:
          expression: "credit_score is null or credit_score between 300 and 850"
          
      - dbt_utils.expression_is_true:
          expression: "utilization_pct is null or utilization_pct between 0 and 100"

  - name: mart_revenue_by_segment_usd
    description: >
      Q1 — Average revenue per customer by segment, in USD. Revenue is
      defined as monthly fee revenue (lifetime fees / tenure_months) plus
      monthly interest accrued on active loans (status in 'current' or 
      'delinquent'). All amounts converted to USD via fx_rates seed.
      See decisions.md §1 and Day 9 corrections (interest_rate scale,
      temporal consistency).
    tests:
      - dbt_utils.expression_is_true:
          expression: "fee_revenue_share between 0 and 1 or fee_revenue_share is null"
    columns:
      - name: customer_segment
        description: "Customer segment: retail / premium / private_banking / sme"
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['retail', 'premium', 'private_banking', 'sme']

      - name: customer_count
        description: "Distinct customers in the segment"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: total_revenue_usd
        description: "Sum of monthly fee + monthly interest revenue across the segment, USD"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: avg_revenue_per_customer_usd
        description: "Average monthly revenue per customer in the segment, USD. Primary metric for Q1."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_fee_revenue_usd
        description: "Sum of monthly fee revenue across segment, USD"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_interest_revenue_usd
        description: "Sum of monthly interest revenue across segment, USD"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: avg_fee_revenue_per_customer_usd
        description: "Average monthly fee revenue per customer in segment, USD"
        tests:
          - not_null

      - name: avg_interest_revenue_per_customer_usd
        description: "Average monthly interest revenue per customer in segment, USD"
        tests:
          - not_null

      - name: fee_revenue_share
        description: "Share of revenue from fees vs interest. NULL when total revenue is 0."
  
  - name: mart_tx_by_channel
    description: >
      Q3, Q17, Q18 — Transaction summary by channel and currency.
      Includes counts (total, completed, failed), value metrics (total, avg)
      on completed transactions only, and failed_rate. See Q3, Q17, Q18.
    columns:
      - name: channel
        description: "Transaction channel: mobile / web / atm / branch / pos"
        tests:
          - not_null
          - accepted_values:
              values: ['mobile', 'web', 'atm', 'branch', 'pos']
      
      - name: currency
        description: "ISO 4217 currency code"
        tests:
          - not_null
          - relationships:
              to: ref('fx_rates')
              field: currency
      
      - name: tx_count
        description: "Total transactions in this (channel, currency) bucket"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      
      - name: completed_tx_count
        description: "Transactions with status = completed"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      
      - name: failed_tx_count
        description: "Transactions with status = failed (is_failed flag)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      
      - name: total_value
        description: "Sum of amounts for completed transactions only"
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 or total_value is null"
      
      - name: avg_ticket
        description: "Average amount of completed transactions"
      
      - name: failed_rate
        description: "Failed/total ratio. Between 0 and 1."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"

  - name: mart_tx_by_category
    description: >
      Q15 — Transaction summary by category and currency. Counts (total,
      completed) and value metrics (total, avg) on completed transactions.
    columns:
      - name: category
        description: "Transaction category (salary, groceries, rent, etc.)"
        tests:
          - not_null
      
      - name: currency
        description: "ISO 4217 currency code"
        tests:
          - not_null
          - relationships:
              to: ref('fx_rates')
              field: currency
      
      - name: tx_count
        description: "Total transactions in this (category, currency) bucket"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      
      - name: completed_tx_count
        description: "Transactions with status = completed"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: mart_tx_by_dow
    description: >
      Q16 — Transaction volume by day of week and currency. Includes
      day_of_week_name for direct labeling in Power BI. Numeric day_of_week
      preserved for ordering (Postgres convention: Sunday=0, Saturday=6).
    columns:
      - name: day_of_week
        description: "Numeric day of week (Postgres DOW: Sunday=0, Saturday=6)"
        tests:
          - not_null
          - accepted_values:
              values: [0, 1, 2, 3, 4, 5, 6]
      
      - name: day_of_week_name
        description: "Day name for display"
        tests:
          - not_null
          - accepted_values:
              values: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']
      
      - name: currency
        description: "ISO 4217 currency code"
        tests:
          - not_null
          - relationships:
              to: ref('fx_rates')
              field: currency
      
      - name: tx_count
        description: "Total transactions in this (day_of_week, currency) bucket"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
  
  - name: mart_loan_dpd
    description: >
      Q8 — Days past due distribution by loan type. Grain: (loan_type, 
      dpd_bucket, currency). Includes bucket_share for direct rendering 
      of distribution percentages in Power BI.
    columns:
      - name: loan_type
        tests:
          - not_null
          - accepted_values:
              values: ['personal', 'mortgage', 'auto', 'education', 'business']
      
      - name: dpd_bucket
        tests:
          - not_null
          - accepted_values:
              values:
                - '00 - Current'
                - '01 - Early (1-29)'
                - '02 - 30-59 DPD'
                - '03 - 60-89 DPD'
                - '04 - 90-179 DPD'
                - '05 - 180+ DPD'
      
      - name: currency
        tests:
          - not_null
          - relationships:
              to: ref('fx_rates')
              field: currency
      
      - name: loan_count
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      
      - name: bucket_share_within_type_currency
        description: "Share of loans in this bucket vs total for the (loan_type, currency). Sums to 1 within each (loan_type, currency)."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"

  - name: mart_loan_composition
    description: >
      Q23 — Loan portfolio composition by type and status. Grain: 
      (loan_type, status, currency). Includes interest metrics for 
      partial coverage of Q4 (interest income by loan type).
    columns:
      - name: loan_type
        tests:
          - not_null
          - accepted_values:
              values: ['personal', 'mortgage', 'auto', 'education', 'business']
      
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['current', 'delinquent', 'default', 'paid_off']
      
      - name: currency
        tests:
          - not_null
          - relationships:
              to: ref('fx_rates')
              field: currency
      
      - name: loan_count
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      
      - name: total_outstanding_balance
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 or total_outstanding_balance is null"
      
      - name: delinquent_count
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      
      - name: default_count
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
  
  - name: mart_delinquency_by_segment
    description: >
      Q5 — Loan delinquency rate by customer segment. Rate denominator is
      customers_with_loans (excludes customers without credit exposure).
    columns:
      - name: customer_segment
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['retail', 'premium', 'private_banking', 'sme']
      - name: customer_count
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: delinquency_rate
        description: "Share of customers (with loans) with at least one delinquent loan."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1 or delinquency_rate is null"
      - name: default_rate
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1 or default_rate is null"

  - name: mart_credit_score_by_country
    description: >
      Q6 — Credit score distribution by country, using FICO bucketing.
      bucket_share_within_country sums to 1.0 per country.
    columns:
      - name: country
        tests:
          - not_null
          - accepted_values:
              values: ['AR', 'BR', 'CL', 'CO', 'MX', 'PE', 'UY']
      - name: credit_score_bucket
        tests:
          - not_null
      - name: customer_count
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: bucket_share_within_country
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"

  - name: mart_utilization_vs_delinquency
    description: >
      Q7 — Relationship between credit utilization and delinquency rate.
      One row per utilization_bucket. Used to visualize the correlation
      between utilization and credit performance.
    columns:
      - name: utilization_bucket
        description: "Utilization band per decisions.md Day 9 §4."
        tests:
          - accepted_values:
              values: ['healthy', 'moderate', 'high', 'maxed', 'over_limit', 'unknown']
      - name: customer_count
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: delinquency_rate
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1 or delinquency_rate is null"

  - name: mart_risk_buckets
    description: >
      Q9 — Internal risk score bucketing with delinquency cross-validation.
      Includes share of total population and observed delinquency per bucket.
    columns:
      - name: risk_bucket
        tests:
          - unique
          - not_null
      - name: customer_count
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: bucket_share
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
      - name: delinquency_rate
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1 or delinquency_rate is null"