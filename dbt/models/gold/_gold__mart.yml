version: 2

# ============================================================================
# Tests and documentation for Gold layer mart models.
#
# Convention: every mart has at minimum:
#   - PK uniqueness + not_null (or composite-key uniqueness via the mart's grain)
#   - accepted_values on every normalized categorical (catches macro/source drift)
#   - relationships from customer-grain marts to silver.dim_customer
#   - expression_is_true on numeric metrics that must satisfy invariants
#     (e.g. non-negative, percentages in [0, 100] or [0, 1])
#   - description on every key column (Day 10 documentation pass)
#
# These tests are tight on purpose: a passing test suite is the contract
# between the Gold layer and Power BI consumers downstream.
#
# Day 10 refactor note: revenue logic is centralized in
# silver.int_customer_monthly_revenue, consumed by both mart_customer_360 and
# mart_revenue_by_segment_usd. See decisions.md Day 10.
# ============================================================================

models:

  # =========================================================================
  # ACQUISITION & DEMOGRAPHICS
  # =========================================================================

  - name: mart_acquisition_trend
    description: >
      One row per calendar month. New customer acquisitions per month with
      cumulative total and MoM growth percentage. Source for Q12 (acquisition
      trend over time). Excludes customers with NULL registration_date.
    columns:

      - name: month
        description: "First day of the month (date_trunc to month)."
        tests:
          - unique
          - not_null

      - name: year
        description: "Calendar year of the month."
        tests:
          - not_null

      - name: month_number
        description: "Calendar month number (1-12)."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 1 and 12"

      - name: month_label
        description: "YYYY-MM string for chronological-lexicographic sort in BI."
        tests:
          - unique
          - not_null

      - name: new_customers
        description: "Distinct customers whose registration_date falls in this month."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: cumulative_customers
        description: "Running total of new_customers, ascending by month."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: mom_growth_pct
        description: >
          Month-over-month % change in new_customers. NULL for first month
          (no prior reference) or when previous month had zero acquisitions.

  # -------------------------------------------------------------------------

  - name: mart_customer_360
    description: >
      One row per customer. Source of truth for Q1 (revenue by segment rollup),
      Q9 (risk buckets), Q10 (count by country/city), Q11 (age by segment),
      Q13 (status breakdown), Q14 (KYC distribution), Q24 (products by segment).
      Combines demographics, relationship, risk, credit profile, digital
      engagement, product counts, and revenue metrics. Revenue logic is
      centralized in silver.int_customer_monthly_revenue (Day 10 refactor —
      see decisions.md).
    columns:

      - name: customer_id
        description: "Primary key. 1:1 with silver.dim_customer."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id

      - name: country
        description: "Customer's country of residence (ISO code)."
        tests:
          - not_null
          - accepted_values:
              values: ['AR', 'BR', 'CL', 'CO', 'MX', 'PE', 'UY']

      - name: city
        description: "Customer's city of residence."

      - name: gender
        description: "Customer gender from source dataset."

      - name: age
        description: "Customer age in years, derived from date_of_birth at silver layer."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 18 and 120"

      - name: age_bucket
        description: "Decade-based age band per decisions.md §6."
        tests:
          - not_null
          - accepted_values:
              values: ['18-25', '26-35', '36-50', '51-65', '65+', 'under_18', 'unknown']

      - name: customer_segment
        description: "Customer segment from the source dataset."
        tests:
          - not_null
          - accepted_values:
              values: ['retail', 'premium', 'private_banking', 'sme']

      - name: tenure_months
        description: "Months since registration_date. Zero for customers registered in the current month (~0.9% of base)."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: tenure_bucket
        description: "Bucketed tenure band: new (<6m), established (6-24m), loyal (>24m), or unknown."
        tests:
          - not_null
          - accepted_values:
              values: ['new', 'established', 'loyal', 'unknown']

      - name: kyc_status
        description: "KYC verification state at most recent observation."
        tests:
          - not_null
          - accepted_values:
              values: ['verified', 'pending', 'expired', 'rejected']

      - name: status
        description: "Customer-level status (distinct from account.status which also has 'frozen' — see business_questions.md Q13)."
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'inactive', 'suspended', 'closed']

      - name: risk_score
        description: "Source-system risk score, 0-100. See Key Findings in business_questions.md — score is non-monotonic vs observed delinquency in this dataset."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 0 and 100"

      - name: risk_bucket
        description: >
          Bucketed risk_score per Q9 literal: "low/medium/high/critical".
          'unknown' should NEVER appear with valid risk_score [0,100] — if it
          does, get_risk_bucket macro has a regression (see decisions.md Day 8).
        tests:
          - not_null
          - accepted_values:
              values: ['low', 'medium', 'high', 'critical']

      - name: credit_score
        description: "Validated FICO score [300, 850]. NULL when source was corrupt (~10% per EDA)."

      - name: credit_score_bucket
        description: "FICO-convention credit score band. See decisions.md §5."

      - name: utilization_pct
        description: "Credit utilization percentage (used / limit × 100). NULL when source data is corrupt or for customers without revolving credit."

      - name: utilization_bucket
        description: "Utilization band per decisions.md Day 9 §4 (healthy/moderate/high/maxed/over_limit/unknown)."

      - name: total_limit
        description: "Sum of credit limits across the customer's revolving products, native currency."

      - name: total_used
        description: "Sum of used credit across the customer's revolving products, native currency."

      - name: late_payments_12m
        description: "Count of late payment events in the last 12 months."

      - name: bankruptcy_flag
        description: "Boolean indicating whether the customer has a bankruptcy on file."

      - name: mobile_app_registered
        description: "Boolean indicating whether the customer has registered for the mobile banking app."

      - name: web_banking_registered
        description: "Boolean indicating whether the customer has registered for web banking."

      - name: accounts_count
        description: "Count of accounts held by the customer. COALESCEd to 0 for customers without account records."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: loans_count
        description: "Count of loans held by the customer (any status). COALESCEd to 0."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: transactions_count
        description: "Count of transactions executed by the customer. COALESCEd to 0."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_products
        description: "accounts_count + loans_count. Source for Q24 (avg products per segment)."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_fees_paid_lifetime
        description: "Cumulative fees paid in native currency, completed status only. Kept for auditability — downstream analytics use monthly_fee_revenue."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: monthly_fee_revenue
        description: >
          Lifetime fees / tenure_months (temporal consistency per decisions.md Day 9).
          Customers with tenure_months=0 receive 0 via COALESCE.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: monthly_interest_income
        description: "Accrued monthly interest on active loans (current + delinquent), native currency."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      # ============================================================================
# Day 11 patch: replace the existing `- name: total_revenue_monthly` entry
# inside `mart_customer_360.columns:` with this expanded block.
# All other column entries in the file remain unchanged.
# ============================================================================

      - name: total_revenue_monthly
        description: |
          monthly_fee_revenue + monthly_interest_income, both in source
          customer currency (no FX conversion at this layer).
          Day 9: temporal-consistency fix (lifetime fees normalized to monthly).
          Day 11: fee component uses GREATEST(tenure_months, 3) to prevent
          division-by-near-zero blowups for short-tenure customers.
          Residual outliers may persist from extreme outstanding_balance
          values in silver.fct_loans (~452 loans > $100M); see warn test
          on silver.fct_loans.outstanding_balance.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
          - dbt_utils.expression_is_true:
              expression: "< 1000000"
              config:
                severity: warn

    tests:
      - dbt_utils.expression_is_true:
          expression: "credit_score is null or credit_score between 300 and 850"

      - dbt_utils.expression_is_true:
          expression: "utilization_pct is null or utilization_pct between 0 and 100"

  # =========================================================================
  # REVENUE & PROFITABILITY
  # =========================================================================

  - name: mart_revenue_by_segment_usd
    description: >
      Q1 — Average revenue per customer by segment, in USD. Revenue is
      defined as monthly fee revenue (lifetime fees / tenure_months) plus
      monthly interest accrued on active loans (status in 'current' or
      'delinquent'). All amounts converted to USD via fx_rates seed.
      Consumes silver.int_customer_monthly_revenue (Day 10 refactor).
      See decisions.md §1 and Day 9 corrections (interest_rate scale,
      temporal consistency).
    tests:
      - dbt_utils.expression_is_true:
          expression: "fee_revenue_share between 0 and 1 or fee_revenue_share is null"
    columns:
      - name: customer_segment
        description: "Customer segment: retail / premium / private_banking / sme."
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['retail', 'premium', 'private_banking', 'sme']

      - name: customer_count
        description: "Distinct customers in the segment."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: total_revenue_usd
        description: "Sum of monthly fee + monthly interest revenue across the segment, USD."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: avg_revenue_per_customer_usd
        description: "Average monthly revenue per customer in the segment, USD. Primary metric for Q1."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_fee_revenue_usd
        description: "Sum of monthly fee revenue across segment, USD."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_interest_revenue_usd
        description: "Sum of monthly interest revenue across segment, USD."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: avg_fee_revenue_per_customer_usd
        description: "Average monthly fee revenue per customer in segment, USD."
        tests:
          - not_null

      - name: avg_interest_revenue_per_customer_usd
        description: "Average monthly interest revenue per customer in segment, USD."
        tests:
          - not_null

      - name: fee_revenue_share
        description: "Share of revenue from fees vs interest. NULL when total revenue is 0."

  # -------------------------------------------------------------------------

  - name: mart_account_mix
    description: >
      One row per (country × account_type × currency). Account counts and
      balance metrics. Sources for Q22 (popular account types) and Q2
      (balances by country, in source currency). Only active accounts.
      Multi-currency: balances are NOT converted (no FX rollup at this grain);
      grain includes currency so sums never mix incompatible units. Power BI
      can layer USD conversion on top via the fx_rates seed if needed.
    columns:

      - name: country
        description: "ISO country code where the account is held."
        tests:
          - not_null
          - accepted_values:
              values: ['AR', 'BR', 'CL', 'CO', 'MX', 'PE', 'UY']

      - name: account_type
        description: "Account product type."
        tests:
          - not_null
          - accepted_values:
              values: ['savings', 'checking', 'investment', 'credit_card']

      - name: currency
        description: "ISO 4217 currency code of the account balance."
        tests:
          - not_null

      - name: accounts_count
        description: "Number of active accounts of this type in this country and currency."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: accounts_with_balance
        description: >
          Subset of accounts_count that have a non-null balance. Exposes
          missing-data rate (~3.1% of active accounts have NULL balance,
          uniformly distributed across types/currencies — synthetic dataset
          noise per decisions.md Day 8).
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_balance
        description: "SUM of balance in source currency. NULL when no account had a balance."

      - name: avg_balance
        description: "Average balance per account in source currency, over accounts with a non-null balance."

      - name: min_balance
        description: "Minimum balance in source currency in the cell."

      - name: max_balance
        description: "Maximum balance in source currency in the cell."

      - name: pct_of_country_accounts
        description: "Share (0-100) of this account_type within the country's total active accounts."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 100"

      - name: pct_of_total_accounts
        description: "Share (0-100) of this (country, account_type, currency) cell within all active accounts globally."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 100"

    tests:
      # Each country's percentages should sum to 100 (within rounding tolerance).
      - dbt_utils.expression_is_true:
          expression: "pct_of_country_accounts >= 0 and pct_of_country_accounts <= 100"

  # =========================================================================
  # RISK & CREDIT
  # =========================================================================

  - name: mart_delinquency_by_segment
    description: >
      Q5 — Loan delinquency rate per customer segment. Rate denominator is
      customers_with_loans (excludes customers without credit exposure).
    columns:
      - name: customer_segment
        description: "Customer segment from dim_customer."
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['retail', 'premium', 'private_banking', 'sme']
      - name: customer_count
        description: "Customers in this segment who hold at least one loan (delinquency denominator)."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: delinquency_rate
        description: "Share of customers (with loans) with at least one delinquent loan."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1 or delinquency_rate is null"
      - name: default_rate
        description: "Share of customers (with loans) with at least one default loan."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1 or default_rate is null"

  # -------------------------------------------------------------------------

  - name: mart_credit_score_by_country
    description: >
      Q6 — Credit score distribution by country, using FICO bucketing.
      bucket_share_within_country sums to 1.0 per country.
    columns:
      - name: country
        description: "Customer's country of residence (ISO code)."
        tests:
          - not_null
          - accepted_values:
              values: ['AR', 'BR', 'CL', 'CO', 'MX', 'PE', 'UY']
      - name: credit_score_bucket
        description: "FICO-convention credit score band per decisions.md §5. 'unknown' captures invalid/null source data (~10% per EDA)."
        tests:
          - not_null
      - name: customer_count
        description: "Customers in this country falling in this credit score bucket."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: bucket_share_within_country
        description: "Share (0-1) of this bucket within country. Sums to 1.0 across buckets within each country."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"

  # -------------------------------------------------------------------------

  - name: mart_utilization_vs_delinquency
    description: >
      Q7 — Relationship between credit utilization and delinquency rate.
      One row per utilization_bucket. Used to visualize the correlation
      between utilization and credit performance.
    columns:
      - name: utilization_bucket
        description: "Utilization band per decisions.md Day 9 §4."
        tests:
          - accepted_values:
              values: ['healthy', 'moderate', 'high', 'maxed', 'over_limit', 'unknown']
      - name: customer_count
        description: "Customers in this utilization bucket who hold revolving credit (denominator for delinquency_rate)."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: delinquency_rate
        description: "Share of customers in this utilization bucket with at least one delinquent loan."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1 or delinquency_rate is null"

  # -------------------------------------------------------------------------

  - name: mart_risk_buckets
    description: >
      Q9 — Internal risk score bucketing with delinquency cross-validation.
      Includes share of total population and observed delinquency per bucket.
      See Key Findings in business_questions.md: the relationship between
      source risk_score and observed delinquency is non-monotonic in this
      dataset.
    columns:
      - name: risk_bucket
        description: "Risk score band per decisions.md §11 (low: 0-30, medium: 31-60, high: 61-85, critical: 86-100)."
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['low', 'medium', 'high', 'critical']
      - name: customer_count
        description: "Customers falling in this risk bucket."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: bucket_share
        description: "Share (0-1) of total customers in this bucket. Sums to 1.0 across buckets."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
      - name: delinquency_rate
        description: "Observed delinquency rate within bucket. Cross-validates the predictive power of the source risk_score."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1 or delinquency_rate is null"

  # -------------------------------------------------------------------------

  - name: mart_loan_dpd
    description: >
      Q8 — Days past due distribution by loan type. Grain: (loan_type,
      dpd_bucket, currency). Includes bucket_share for direct rendering
      of distribution percentages in Power BI.
    columns:
      - name: loan_type
        description: "Loan product type (personal, mortgage, auto, business, credit_line)."
        tests:
          - not_null
      - name: dpd_bucket
        description: >
          Days-past-due band, industry-standard cutoffs: 00-Current, 01-Early
          (1-29), 02-30-59 DPD, 03-60-89 DPD, 04-90-179 DPD, 05-180+ DPD.
          Prefix-numbered for chronological sort in Power BI.
        tests:
          - not_null
      - name: currency
        description: "Currency of the loan principal."
        tests:
          - not_null
      - name: loan_count
        description: "Number of loans in this (loan_type, dpd_bucket, currency) cell."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: total_outstanding_balance
        description: "Sum of outstanding_balance in native currency for the loans in this cell."
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 or total_outstanding_balance is null"
      - name: avg_outstanding_balance
        description: "Average outstanding balance per loan in the cell, native currency."
      - name: avg_days_past_due
        description: "Average days past due within the cell. Useful for visualizing severity within a bucket."
      - name: bucket_share_within_type_currency
        description: "Share (0-1) of this dpd_bucket within the (loan_type, currency) partition. Sums to 1.0."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"

  # -------------------------------------------------------------------------

  - name: mart_loan_composition
    description: >
      Q23 — Loan portfolio composition: outstanding balance by type and
      status. Grain: (loan_type, status, currency). Also supports Q4
      (interest income by loan type) via total_monthly_interest_accrued.
      Reads from silver.int_loan_portfolio_metrics.
    columns:
      - name: loan_type
        description: "Loan product type."
        tests:
          - not_null
      - name: status
        description: "Loan status."
        tests:
          - not_null
          - accepted_values:
              values: ['current', 'delinquent', 'default', 'paid_off']
      - name: currency
        description: "Currency of the loan principal."
        tests:
          - not_null
      - name: loan_count
        description: "Number of loans in this cell."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: total_principal
        description: "Sum of original loan principal at origination, native currency."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: total_outstanding_balance
        description: "Sum of current outstanding balance, native currency."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: avg_outstanding_balance
        description: "Average outstanding balance per loan, native currency."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: avg_interest_rate
        description: "Average annual interest rate, decimal (0-1) scale per decisions.md Day 9."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
      - name: total_monthly_interest_accrued
        description: >
          Monthly interest accrued: SUM(outstanding_balance × interest_rate_decimal / 12).
          Source for Q4 (interest income by loan type) when filtered to active loans
          (status in current, delinquent).
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: delinquent_count
        description: "Loans with is_delinquent flag set within this cell."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: default_count
        description: "Loans with is_default flag set within this cell."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: outstanding_share_within_type_currency
        description: "Share (0-1) of outstanding_balance for this status within the (loan_type, currency) partition. Sums to 1.0."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1 or outstanding_share_within_type_currency is null"

  # =========================================================================
  # TRANSACTION PATTERNS
  # =========================================================================

  - name: mart_tx_by_channel
    description: >
      Q3, Q17, Q18 — Transaction summary by channel and currency. Includes
      counts (total, completed, failed), value metrics (total, avg) on
      completed transactions only, and failed_rate.
    columns:
      - name: channel
        description: "Transaction channel: mobile / web / atm / branch / pos."
        tests:
          - not_null
          - accepted_values:
              values: ['mobile', 'web', 'atm', 'branch', 'pos']

      - name: currency
        description: "ISO 4217 currency code."
        tests:
          - not_null
          - relationships:
              to: ref('fx_rates')
              field: currency

      - name: tx_count
        description: "Total transactions in this (channel, currency) bucket."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: completed_tx_count
        description: "Transactions with status = completed."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: failed_tx_count
        description: "Transactions with status = failed (is_failed flag)."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_value
        description: "Sum of amounts for completed transactions only, native currency."
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 or total_value is null"

      - name: avg_ticket
        description: "Average amount of completed transactions, native currency. Source for Q17."

      - name: failed_rate
        description: "Failed/total ratio. Source for Q18. Between 0 and 1."

  # -------------------------------------------------------------------------

  - name: mart_tx_by_category
    description: >
      Q15 — Transaction summary by category and currency. Counts (total,
      completed) and value metrics (total, avg) on completed transactions.
    columns:
      - name: category
        description: "Transaction category (salary, groceries, rent, etc.)."
        tests:
          - not_null

      - name: currency
        description: "ISO 4217 currency code."
        tests:
          - not_null
          - relationships:
              to: ref('fx_rates')
              field: currency

      - name: tx_count
        description: "Total transactions in this (category, currency) bucket."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: completed_tx_count
        description: "Transactions with status = completed."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: total_value
        description: "Sum of amounts for completed transactions only, native currency."

      - name: avg_ticket
        description: "Average amount of completed transactions, native currency."

  # -------------------------------------------------------------------------

  - name: mart_tx_by_dow
    description: >
      Q16 — Transaction volume by day of week and currency. Includes
      day_of_week_name for direct labeling in Power BI. Numeric day_of_week
      preserved for ordering (Postgres convention: Sunday=0, Saturday=6).
    columns:
      - name: day_of_week
        description: "Numeric day of week (Postgres DOW: Sunday=0, Saturday=6)."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1, 2, 3, 4, 5, 6]

      - name: day_of_week_name
        description: "Day name for display."
        tests:
          - not_null
          - accepted_values:
              values: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']

      - name: currency
        description: "ISO 4217 currency code."
        tests:
          - not_null
          - relationships:
              to: ref('fx_rates')
              field: currency

      - name: tx_count
        description: "Total transactions in this (day_of_week, currency) bucket."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

  # -------------------------------------------------------------------------

  - name: mart_international_transfers
    description: >
      Q19 — International transfer patterns. Grain: (origin_country,
      tx_currency). Includes all transfers with is_international flag
      aggregated; allows Power BI to filter or compute share. See
      decisions.md Day 9 §8 for the international classifier definition.
    columns:
      - name: origin_country
        description: "ISO country code of the customer originating the transfer."
        tests:
          - not_null
          - accepted_values:
              values: ['AR', 'BR', 'CL', 'CO', 'MX', 'PE', 'UY']

      - name: tx_currency
        description: "Currency of the transfer."
        tests:
          - not_null
          - relationships:
              to: ref('fx_rates')
              field: currency

      - name: tx_count
        description: "Total transfers in this (origin_country, tx_currency) corridor regardless of status or domesticity."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: international_tx_count
        description: "Transfers classified as international per the rule in decisions.md Day 9 §8."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: domestic_tx_count
        description: "Transfers classified as domestic (tx_currency matches both account currency AND customer country currency)."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: completed_tx_count
        description: "Subset of tx_count with status = completed."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: completed_international_tx_count
        description: "Subset of international_tx_count with status = completed."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: international_share
        description: "Share (0-1) of international transfers within the (country, currency) corridor."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"

      - name: total_value
        description: "Sum of completed transfer amounts in native tx_currency (all transfers, domestic + international)."
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 or total_value is null"

      - name: total_international_value
        description: "Sum of completed transfer amounts for international transfers only, native tx_currency."
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 or total_international_value is null"

      - name: avg_ticket
        description: "Average completed transfer amount (all transfers), native currency."

      - name: avg_international_ticket
        description: "Average completed international transfer amount, native currency."

  # =========================================================================
  # DIGITAL ENGAGEMENT
  # =========================================================================

  - name: mart_digital_adoption_by_segment
    description: >
      Q20 — Mobile app adoption rate by customer segment. Includes
      complementary digital engagement metrics: web adoption, any digital,
      push notifications, paperless, and average monthly logins for depth.
    columns:
      - name: customer_segment
        description: "Customer segment from dim_customer."
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['retail', 'premium', 'private_banking', 'sme']

      - name: customer_count
        description: "Customers in this segment (denominator for adoption rates)."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: mobile_adoption_rate
        description: "Share of customers in the segment with mobile_app_registered=TRUE."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1 or mobile_adoption_rate is null"

      - name: web_adoption_rate
        description: "Share of customers in the segment with web_banking_registered=TRUE."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1 or web_adoption_rate is null"

      - name: any_digital_adoption_rate
        description: "Share with mobile OR web registered."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1 or any_digital_adoption_rate is null"

      - name: push_notifications_rate
        description: "Share of customers with push notifications enabled."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1 or push_notifications_rate is null"

      - name: paperless_rate
        description: "Share of customers opted in to paperless statements."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1 or paperless_rate is null"

  # -------------------------------------------------------------------------

  - name: mart_channel_preference_by_age
    description: >
      Q21 — Channel preference by age bucket. Grain: (age_bucket,
      preferred_channel). Exposes all 5 channels separately; Power BI
      groups digital (mobile+web) vs non-digital (atm+branch+phone)
      at visualization time.
    columns:
      - name: age_bucket
        description: "Decade-based age band per decisions.md §6."
        tests:
          - not_null

      - name: preferred_channel
        description: "Customer's preferred interaction channel."
        tests:
          - not_null
          - accepted_values:
              values: ['mobile', 'web', 'atm', 'branch', 'phone']

      - name: customer_count
        description: "Customers with this preferred_channel in this age_bucket."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: bucket_share_within_age
        description: "Share (0-1) of channel within age bucket. Sums to 1.0 per age."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"

  # -------------------------------------------------------------------------

  - name: mart_top_merchants
    description: |
      Top merchants by transaction volume and value, with grain
      (merchant × currency). Answers Q22. Only completed
      transactions are counted. Rankings are within-currency to
      avoid mixing scales across LATAM currencies. Includes
      top_category enrichment for qualitative context.
    columns:
      - name: merchant
        description: Merchant identifier from completed transactions in silver.fct_transactions.
        tests:
          - not_null
      - name: currency
        description: Source transaction currency (no FX applied).
        tests:
          - not_null
      - name: top_category
        description: |
          Most frequent transaction category for this merchant × currency
          combination. Tiebroken alphabetically for deterministic results.
      - name: tx_count
        description: Number of completed transactions for this merchant × currency.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: total_value
        description: Sum of completed transaction amounts in source currency.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: avg_ticket
        description: Average transaction amount in source currency.
        tests:
          - not_null
      - name: rank_by_value_within_currency
        description: Rank by total_value, partitioned by currency. Rank=1 is top merchant in that currency.
        tests:
          - not_null

# ============================================================================

  - name: mart_revenue_monthly_by_segment_usd
    description: |
      Monthly revenue (fee + interest) per customer_segment, in USD.
      Grain: (revenue_month × customer_segment). Powers the time-series
      line chart on the Revenue & Transactions dashboard page.
      Current calendar month is excluded to avoid partial-month bias.
      Interest accrual uses simplified flat-monthly allocation due to
      absence of a loan_schedule table in source data. See decisions.md
      Day 11.
    columns:
      - name: revenue_month
        description: First day of the calendar month. Strictly before current month.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "< date_trunc('month', current_date)::date"
      - name: customer_segment
        description: retail / sme / premium / private_banking
        tests:
          - not_null
          - accepted_values:
              values: ['retail', 'sme', 'premium', 'private_banking']
      - name: fee_revenue_usd
        description: Sum of completed fee transactions in this month for this segment, converted to USD.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: interest_revenue_usd
        description: Allocated monthly interest accrual for active loans of customers in this segment, converted to USD.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: total_revenue_usd
        description: fee_revenue_usd + interest_revenue_usd, all in USD.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"