# dbt project configuration for the Qversity fintech pipeline — Databricks.
#
# Materialization strategy by layer is UNCHANGED from the Postgres version:
#   - silver/        -> table   (heavy flattening + casts; materialize once)
#   - intermediate/  -> view    (organizational only, no own logic)
#   - gold/          -> table   (what Power BI hits via the SQL Warehouse)
#
# On Databricks `table` = managed Delta table in Unity Catalog. The schema
# layout (silver / gold) is preserved via the custom generate_schema_name
# macro; the catalog comes from profiles.yml (`catalog: qversity`).

name: 'qversity'
version: '0.1.0'
config-version: 2

profile: 'qversity'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  qversity:
    silver:
      +materialized: table
      +schema: silver
    intermediate:
      +schema: silver
      +materialized: view
    gold:
      +materialized: table
      +schema: gold

seeds:
  qversity:
    +schema: silver
    fx_rates:
      # CAMBIO vs Postgres: Databricks usa STRING / DECIMAL / DATE.
      # (varchar(3) -> string, numeric(18,8) -> decimal(18,8))
      +column_types:
        currency: "string"
        rate_to_usd: "decimal(18,8)"
        as_of_date: "date"
    country_currency:
      +column_types:
        country_code: "string"
        currency_code: "string"

vars: {}
